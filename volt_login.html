    eye.setAttribute('aria-label', on ? 'Hide password' : 'Show password');
    paintPassword(false);
    const r = eye.getBoundingClientRect(), p = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    goal = above(p); strike(p);
  });

  // a wrong password: the light sags and comes back, orange sparks drift down, the dots burn out and the ball climbs back
  let burnT;
  function shortCircuit() {
    shortAt = performance.now(); inside = false;
    if (!reduce) for (let i = 0; i < 14; i++)
      sparks.push({ x, y, vx: (Math.random() - .5) * 4, vy: -(1 + 2.5 * Math.random()), age: 0, life: 1.2 + .6 * Math.random(), r: 1 + Math.random(), hot: 1 });
    note.textContent = 'Wrong password'; note.classList.add('on');
    pass.value = ''; passField.classList.add('burn');
    clearTimeout(burnT); burnT = setTimeout(() => { passField.classList.remove('burn'); paintPassword(false); }, 600);
    pass.focus(); goal = above(spot(pass));
  }

  async function signIn(login, password) {
    // a real request goes here, for example:
    // const res = await fetch('/api/login', {
    //   method: 'POST',
    //   headers: { 'Content-Type': 'application/json' },
    //   body: JSON.stringify({ login, password }),
    // });
    // return res.ok;
    await wait(250);
    return password === DEMO_PASSWORD;
  }

  let round = 0;                            // grows on every submit and reset, so a late answer can tell it's stale
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (send.classList.contains('done')) return;
    const empty = !email.value ? email : !pass.value ? pass : null;
    if (empty) { goal = above(spot(empty)); empty.focus(); return; }
    goal = at(send);
    const mine = ++round, answer = signIn(email.value, pass.value);
    await wait(200); if (mine !== round) return;
    inside = true;                                   // the ball goes into the button
    const [ok] = await Promise.all([answer, wait(100)]);
    if (mine !== round) return;
    if (!ok) return shortCircuit();
    send.style.setProperty('--hx', x - send.getBoundingClientRect().left + 'px');
    send.classList.add('done');
    night.classList.add('day');
    charged = performance.now();
    const b = send.getBoundingClientRect();
    if (!reduce) for (let i = 0; i < 24; i++) {        // the charged button throws electric sparks that slow down and settle
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.6, v = 1.8 + 3.2 * Math.random();
      sparks.push({ x: b.left + 20 + Math.random() * (b.width - 40), y: b.top + 6, vx: Math.cos(a) * v * 1.2, vy: Math.sin(a) * v, age: 0, life: 1.4 + Math.random(), r: .9 + 1.1 * Math.random(), hot: 0 });
    }
    await wait(750);
    inside = false;
    const r = send.getBoundingClientRect();
    goal = { x: r.left + r.width * .66, y: r.top - 22 };
  });

  // optional demo: call play() to auto-type; stops on click or key
  let demo = false;
  const stopDemo = () => {
    if (!demo) return;
    demo = false;
    mailField.classList.remove('lit');
    reset();
  };
  addEventListener('pointerdown', stopDemo, true);
  addEventListener('keydown', stopDemo, true);

  function reset() {
    round++; away = false;
    clearTimeout(burnT); shortAt = -1e4; sparks.length = 0;
    email.value = pass.value = '';
    passField.classList.remove('show', 'burn'); eye.setAttribute('aria-pressed', false);
    send.classList.add('still'); send.classList.remove('done');       // back to Sign in at once, no unfilling
    requestAnimationFrame(() => requestAnimationFrame(() => send.classList.remove('still')));
    night.classList.remove('day'); note.classList.remove('on');
    paintPassword(false); inside = false; charged = null;
  }
  async function typeInto(input, word, gap) {
    for (const ch of word) {
      if (!demo) return false;
      input.value += ch; input.dispatchEvent(new Event('input'));
      await wait(gap);
    }
    return demo;
  }

  async function play() {
    demo = true;
    await wait(200); if (!demo) return;
    mailField.classList.add('lit');
    if (!await typeInto(email, 'you@example.com', 42)) return;
    await wait(60); if (!demo) return;
    mailField.classList.remove('lit'); pass.focus();
    await wait(90); if (!demo) return;
    if (!await typeInto(pass, 'zap', 72)) return;
    form.requestSubmit();                             // a wrong one first: a short circuit
    await wait(920); if (!demo) return;
    if (!await typeInto(pass, DEMO_PASSWORD, 72)) return;
    await wait(250); if (!demo) return;
    eye.click();
    await wait(300); if (!demo) return;
    form.requestSubmit();
    await wait(4000); if (!demo) return;
    goal = { x: goal.x + 30, y: goal.y - 60 }; away = true;   // it lifts and fades out like ball lightning, the dark comes back
    night.classList.remove('day');
    await wait(1000); if (!demo) return;
    reset();
    goal = above(spot(email)); x = goal.x - 60; y = goal.y - 30; vx = vy = 0;   // and comes back over the email field
    await wait(1400); if (demo) play();
  }
</script>
</body>
</html>
